<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <title>LGU Maasin City - OCCR Appointment Booking Form</title>
  </head>
  <body>
    <div class="form-container">
      <h1>Book an appointment with us</h1>
      <form id="booking-form" novalidate>

        <div class="input-group">
          <label for="first-name">
            <span class="label-text">First name</span>
            <input type="text" id="first-name" name="first-name" required />
            <span class="form-error" id="first-name-error" hidden>
              <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
              </svg>
              <span class="error-text"></span>
            </span>
          </label>
          <label for="middle-name">
            <span class="label-text">Middle name <em>(Optional)</em></span>
            <input type="text" id="middle-name" name="middle-name" />
            <span class="form-error" id="middle-name-error" hidden>
              <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
              </svg>
              <span class="error-text"></span>
            </span>
          </label>
        </div>
        
        <div class="input-group">
          <label for="last-name">
            <span class="label-text">Last name</span>
            <input type="text" id="last-name" name="last-name" required />
            <span class="form-error" id="last-name-error" hidden>
              <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
              </svg>
              <span class="error-text"></span>
            </span>
          </label>
          <label for="suffix">
            <span class="label-text">Suffix <em>(Optional)</em></span>
            <input type="text" id="suffix" name="suffix" required />
            <span class="form-error" id="suffix-error" hidden>
              <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
              </svg>
              <span class="error-text"></span>
            </span>
          </label>
        </div>

        <div class="input-group">
          <label for="email">
            <span class="label-text">Email address</span>
            <input type="email" id="email" name="email" required />
            <span class="form-error" id="email-error" hidden>
              <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
              </svg>
              <svg class="icon icon-success" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm-1.2 13.4L4.6 10.2l1.4-1.4 2.8 2.8 5.6-5.6 1.4 1.4-7 7z"/>
              </svg>
              <span class="error-text"></span>
            </span>
          </label>
          <label for="phone">
            <span class="label-text">Phone number</span>
            <input
              type="tel"
              id="phone"
              name="phone"
              pattern="[0-9]{4}-[0-9]{3}-[0-9]{4}"
              required
            />
            <span class="form-error" id="phone-error" hidden>
              <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
              </svg>
              <svg class="icon icon-success" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
                <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm-1.2 13.4L4.6 10.2l1.4-1.4 2.8 2.8 5.6-5.6 1.4 1.4-7 7z"/>
              </svg>
              <span class="error-text"></span>
            </span>
          </label>
        </div>

        <label for="service-type">
          <span class="label-text">Service type</span>
          <select id="service-type" name="service-type" required>
            <option value="">Select a service</option>
            <option value="late-registration">Late registration</option>
            <option value="clerical-error-correction">
              Clerical Error Correction
            </option>
            <option value="supplemental-report">Supplemental Report</option>
            <option value="legitimation">Legitimation</option>
            <option value="marriage-license">Marriage License</option>
          </select>
          <span class="form-error" id="service-type-error" hidden>
            <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
              <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
            </svg>
            <span class="error-text"></span>
          </span>
        </label>

        <label for="appointment-date">
          <span class="label-text">Date of appointment</span>
          <input type="date" id="appointment-date" name="appointment-date" required/>
          <span class="form-error" id="appointment-date-error" hidden>
            <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
              <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
            </svg>
            <svg class="icon icon-success" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
              <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm-1.2 13.4L4.6 10.2l1.4-1.4 2.8 2.8 5.6-5.6 1.4 1.4-7 7z"/>
            </svg>
            <span class="error-text"></span>
          </span>
        </label>

        <label for="time-slot"
          >Time slot
          <select id="time-slot" name="time-slot" required>
            <option value="">Select a time slot</option>
            <option value="8am">8:00 AM</option>
            <option value="9am">9:00 AM</option>
            <option value="10am">10:00 AM</option>
            <option value="11am">11:00 AM</option>
            <option value="12nn">12:00 NN</option>
            <option value="1pm">1:00 PM</option>
            <option value="2pm">2:00 PM</option>
            <option value="3pm">3:00 PM</option>
            <option value="4pm">4:00 PM</option>
          </select>
          <span class="form-error" id="time-slot-error" hidden>
            <svg class="icon icon-error" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
              <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm1 13H9v-2h2v2zm0-4H9V5h2v6z"/>
            </svg>
            <svg class="icon icon-success" viewBox="0 0 20 20" width="16" height="16" fill="currentColor">
              <path d="M10 1a9 9 0 100 18 9 9 0 000-18zm-1.2 13.4L4.6 10.2l1.4-1.4 2.8 2.8 5.6-5.6 1.4 1.4-7 7z"/>
            </svg>
            <span class="error-text"></span>
          </span>
        </label>

        <button type="submit" class="btn btn-primary">Book appointment</button>
      </form>
    </div>

    <script src="script/script.js"></script>
  </body>
</html>
